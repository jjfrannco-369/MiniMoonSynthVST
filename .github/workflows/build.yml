name: Build Mini JJ Moog v2 (Windows x64 VST3)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows-vst3:
    runs-on: windows-2022

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Baixar framework JUCE
        run: |
          git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git C:/JUCE

      - name: Configurar projeto com CMake (Compatível Windows 7 x64)
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_PATH="C:/JUCE" -DCMAKE_CXX_FLAGS="/D_WIN32_WINNT=0x0601 /DWINVER=0x0601"

      - name: Compilar VST3 64 bits
        run: |
          cmake --build build --config Release --target MiniJJMoogVST_VST3

      - name: Empacotar arquivo VST3 para download
        uses: actions/upload-artifact@v4
        with:
          name: Mini-JJ-Moog-v2-Win64-VST3
          path: build/MiniJJMoogVST_artefacts/Release/VST3/
